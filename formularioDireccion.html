<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación</title>
</head>
<body>
    <div class="container">
        <h1>Ingrese su información de residencia</h1> <br> <br>
        <form id="ubicacionForm">
            <label for="nombre">Nombre</label>
            <label for="apellido">Apellido</label><br>
            <input type="text" id="nombre" placeholder="Ingrese su nombre">
            <input type="text" id="apellido" placeholder="Ingrese su apellido"> <br>
            <label for="telefono">Telefono</label>
            <label for="correo">correo</label><br>
            <input type="tel" id="telefono" placeholder="Ingrese su telefono" onblur="validarNumero();">
            <input type="text" id="correo" placeholder="Ingrese su correo" onblur="validarNumero();"> <br>
            <label for="cp">Código postal</label>
            <label for="estado">Estado</label><br>
            <input type="text" id="cp" placeholder="Ingrese su código postal" onblur="validarCp();">
            <input type="text" id="estado" placeholder="Ingrese su estado"> <br>
            <label for="colonia">Colonia</label>
            <label for="municipio">Municipio</label><br>
            <input type="text" id="colonia" placeholder="Ingrese su colonia"> 
            <input type="text" id="municipio" placeholder="Ingrese su municipio"><br>
            <label for="calle">Calle</label>
            <label for="numero">Número</label> <br>
            <input type="text" id="calle" placeholder="Ingrese su calle"> 
            <input type="text" id="numero" placeholder="Ingrese el numero de domicilio">
            <section id="residencia">
                <p>¿Es tu trabajo o tu casa?</p>
                <input type="radio" id="laboral" name="residencia" value="laboral">
                <label for="laboral">Laboral</label>
                <input type="radio" id="residencial" name="residencia" value="residencial">
                <label for="residencial">Residencial</label>
            </section> <br>
            <!--                                PARA EL FRONT IMPORTANTE
                PONER resize: none; PARA QUE EL USUARIO NO PUEDA MODIFICAR LAS DIMENSIONES 
            -->
            <textarea id="indicaciones" placeholder="Indicaciones adicionales de esta dirección"></textarea> <br><br>
            <button type="button" onclick="enviarForm()">Enviar</button>
        </form>
        <p id="output"></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module">
        import { obtenerCoordenadas } from './Funciones/validaDireccion.js'
        import { guardarDirec } from './Funciones/validaDireccion.js'

        // Validamos el número de telefono.
        function validarNumero(){
            const telefono = document.getElementById("telefono").value;
            if(telefono.length != 10){
                alert("Telefono no valido");
                document.getElementById("telefono").value = ""; // Se limpia el formulario evitando que se envie.
            }
        }

        window.validarNumero = validarNumero;

        // Validamos el código postal.
        function validarCp(){
            const cp = document.getElementById("cp").value;
            if(cp.length != 5){
                alert("Código postal no valido");
                document.getElementById("cp").value = ""; // Se limpia el formulario evitando que se envie.
            }
        }

        window.validarCp = validarCp;

        
        async function enviarForm() {
            const nombre = document.getElementById("nombre").value;
            const apellido = document.getElementById("apellido").value;
            const telefono = document.getElementById("telefono").value;
            const correo = document.getElementById("correo").value;
            const cp = document.getElementById("cp").value;
            const estado = document.getElementById("estado").value;
            const colonia = document.getElementById("colonia").value;
            const municipio = document.getElementById("municipio").value;
            const calle = document.getElementById("calle").value;
            const numero = document.getElementById("numero").value;
            const indicaciones = document.getElementById("indicaciones").value;


            let residencia;
            const radios = document.getElementsByName("residencia");
            for (const radio of radios) {
                if (radio.checked) {
                    residencia = radio.value;
                    break;
                }
            }

            if(nombre && apellido && telefono && correo && cp && estado && colonia  
                && municipio && calle && numero && residencia){
                const ubicacion = numero + " " + calle + ", " + municipio + ", " + estado + ", " + cp;
                console.log(ubicacion);
                const consulta = await obtenerCoordenadas(ubicacion);
                console.log(consulta);

                const generaGuia = Math.floor(Math.random() *  9000000) + 1000000; // Genera una guia de 7 dígitos
                    

                if(consulta == 1){
                   const direccionData ={
                    nombre: nombre,
                    apellido: apellido,
                    telefono: telefono,
                    correo: correo,
                    cp: cp,
                    estado: estado,
                    colonia: colonia,
                    municipio: municipio,
                    calle: calle, 
                    numero: numero,
                    residencia: residencia,
                    ubicacion: ubicacion,
                    indicaciones: indicaciones,
                    agregado: false,
                    guia: generaGuia
                   }

                    guardarDirec(direccionData);
                }
            }else{
                alert("Faltan campos por llenar")
            }

            console.log(nombre,apellido,telefono,cp,estado,colonia,calle,numero,residencia,indicaciones);

        }

        window.enviarForm = enviarForm;
    </script>
</body>
</html>
