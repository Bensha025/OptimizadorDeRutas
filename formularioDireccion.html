                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                            <label for="nombre">Nombre</label>
                            <input class="border border-gray-300 p-2 rounded w-full" id="nombre" placeholder="Ingrese su nombre" type="text"/>

                        <div>

                                <label for="laboral">Laboral</label>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js" integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>
<script type="module">
    import { obtenerCoordenadas } from './Funciones/validaDireccion.js'
    import { guardarDirec } from './Funciones/validaDireccion.js'

    let map = L.map('mi_mapa').setView([20.65652, -103.325269], 15);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let marker;         
    let marcador = false; 
    let moverMarcador;
    const divConfirmar = document.getElementById('confirmar');
    const boton = document.createElement('button');
    const enviar = document.getElementById('enviar');
    boton.innerText = 'Confirmar ubicación'; // Texto del botón
    boton.id = 'confirmar';
    boton.classList.add('boton-estilo');

    function onMapClick(e,ubicacion) {
        const coord = [e.latlng.lat, e.latlng.lng];

        if (marcador){
            marker.remove();
            marcador = false;
        }
        if (!marcador) {
            marker = L.marker(coord).addTo(map).bindPopup('Tu dirección: ' + ubicacion);
            marcador = true; 
        }

        return coord;
    }

    async function mostrarUbicacion(coordenadas, ubicacion) {
        let marker; // Variable local para manejar el marcador actual
        let marcadorActivo = false; // Bandera para indicar si hay un marcador en el mapa

        // Agregar el marcador inicial
        marker = L.marker(coordenadas).addTo(map).bindPopup('Tu dirección: ' + ubicacion);
        map.setView(coordenadas, map.getZoom());

        // Pausa de 1 segundo antes de continuar
        await pausa(1000);

        const moverMarcador = swal({
            title: '¿Desea mover manualmente su dirección?',
            text: 'Puede ajustar su ubicación en el mapa.',
            buttons: ['Cancelar', 'Mover'],
            dangerMode: true
        }).then((willMove) => {
            if (willMove) {
                // Acción cuando se confirma mover el marcador
                console.log('El usuario decidió mover la dirección.');
                // Aquí puedes agregar la lógica para activar la funcionalidad de mover el marcador
            } else {
                swal('Acción cancelada', 'No se realizó ningún cambio.', 'info');
            }
        });
        if (moverMarcador) {
            // Eliminar el marcador inicial y permitir clics en el mapa
            enviar.remove();
            marker.remove();
            marcadorActivo = false;
            let nuevasCoordenadas;

            return new Promise((resolve, reject) => {
                const confirmarDireccion = () => {
                    const confirmar = confirm("Deseas confirmar la nueva direccion?");
                    if (confirmar) {
                        // Si confirma, eliminar el botón y desactivar el clic en el mapa
                        boton.remove();
                        map.off('click'); // Deshabilitar los clics en el mapa después de confirmar
                        resolve(nuevasCoordenadas); // Retornar las coordenadas finales del marcador
                    } else {
                        // Si no confirma, eliminar el marcador actual
                        marker.remove();
                        marcadorActivo = false;
                        swal({
                            title: "¡No se ha enviado la solicitud!",
                            text: "Vuelve a intentarlo",
                            icon: "warning"
                        }).then(() => {
                            // Recargar la página después de cerrar la alerta
                            location.reload();
                        });
                    }
                };
                

                map.on('click', (e) => {
                    nuevasCoordenadas = { lat: e.latlng.lat, lon: e.latlng.lng };

                    // Si ya existe un marcador, eliminarlo antes de agregar uno nuevo
                    if (marcadorActivo) {
                        marker.remove();
                    }

                    // Crear un nuevo marcador en la ubicación seleccionada
                    marker = L.marker(nuevasCoordenadas).addTo(map).bindPopup('Tu dirección seleccionada.');
                    marcadorActivo = true; // Actualizamos la bandera

                    // Asegura que el botón solo se agregue una vez
                    if (!divConfirmar.contains(boton)) {
                        divConfirmar.appendChild(boton);
                    }

                    // Limpiar eventos previos del botón antes de agregar uno nuevo
                    boton.removeEventListener('click', confirmarDireccion); // Eliminar cualquier evento anterior
                    boton.addEventListener('click', confirmarDireccion);   // Agregar el evento actual
                });
            });
        } else {
            // Si no desea mover, retornar las coordenadas originales
            return coordenadas;
        }
    }


    function pausa(milisegundos) {
        return new Promise(resolve => setTimeout(resolve, milisegundos));
    }

    // Valida el correo.
    async function validaCorreo(){
            const correo = document.getElementById("correo").value;
        if (correo.includes("@")) {
            const resultado = await validarCorreoAdmin(correo);
            if(resultado == 1){
                    swal('Excelente','Correo registrado','success');
                    document.getElementById("correo").value = "";
             }
        }else{
                document.getElementById("correo").value = "";
                swal('Espera','Ingresa un correo valido','warnnig');
        }
    }
    window.validaCorreo = validaCorreo;

    // Validamos el número de telefono.
    function validarNumero() {
        const telefono = document.getElementById("telefono").value;
        const errorMessage = document.getElementById("telefono-error");

        if (telefono.length != 10) {
            errorMessage.style.display = "block"; // Muestra el mensaje de error para teléfono
            document.getElementById("telefono").value = ""; // Limpia el campo
        } else {
            errorMessage.style.display = "none"; // Oculta el mensaje si es válido
        }
    }

    window.validarNumero = validarNumero;

    // Validamos el código postal.
    function validarCp() {
        const cp = document.getElementById("cp").value;
        const errorMessage = document.getElementById("cp-error");

        if (cp.length != 5) {
            errorMessage.style.display = "block"; // Muestra el mensaje de error para CP
            document.getElementById("cp").value = ""; // Limpia el campo
        } else {
            errorMessage.style.display = "none"; // Oculta el mensaje si es válido
        }
    }

    window.validarCp = validarCp;

        
    async function enviarForm() {
        const nombre = document.getElementById("nombre").value;
        const apellido = document.getElementById("apellido").value;
        const telefono = document.getElementById("telefono").value;
        const cp = document.getElementById("cp").value;
        const estado = document.getElementById("estado").value;
        const colonia = document.getElementById("colonia").value;
        const municipio = document.getElementById("municipio").value;
        const calle = document.getElementById("calle").value;
        const numero = document.getElementById("numero").value;
        const correo = document.getElementById("correo").value;
        const indicaciones = document.getElementById("indicaciones").value;


        let residencia;
        const radios = document.getElementsByName("residencia");
        for (const radio of radios) {
            if (radio.checked) {
                residencia = radio.value;
                break;
            }
        }

        if(nombre && apellido && telefono && cp && estado && colonia && municipio 
            && calle && numero && residencia){
            const ubicacion = numero + " " + calle + ", " + municipio + ", " + estado + ", " + cp;
            console.log(ubicacion);
            const consulta = await obtenerCoordenadas(ubicacion);
            console.log(consulta);

            const validarConsulta = await mostrarUbicacion(consulta, ubicacion);

            const generaGuia = Math.floor(Math.random() *  9000000) + 1000000; // Genera una guia de 7 dígitos

            if(validarConsulta){
                const direccionData ={
                nombre: nombre,
                apellido: apellido,
                telefono: telefono,
                correo: correo,
                cp: cp,
                estado: estado,
                colonia: colonia,
                municipio: municipio,
                calle: calle, 
                numero: numero,
                residencia: residencia,
                ubicacion: ubicacion,
                indicaciones: indicaciones,
                agregado: false,
                guia: generaGuia,
                coordenadas: validarConsulta,
                estatus: 0
                }

                let valor = await guardarDirec(direccionData);
                console.log(valor)
                if(valor){
                    swal('Dirección guardada con exito.','Tu numero de guia es:' + valor,'success');
                }
            }
        }else{
            swal('Espera','Faltan campos por llenar','error');
            
        }

        console.log(nombre,apellido,telefono,cp,estado,colonia,calle,numero,residencia,indicaciones);
    }
        
    window.enviarForm = enviarForm;
</script>
