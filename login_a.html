<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>πTech | Home</title>
    <link rel="stylesheet" href="css/style2.css">
    <link rel="stylesheet" href="cssq/load.css">
    <link rel="icon" href="img/Logo - icon.png">
</head>
<body>
    <header>
        <div class="sec-1">
            <img src="img/logo thelma.png" width="250px" alt="">
        </div>
        <nav class="navigation">
            <a href="#">Inicio</a>
            <a href="#">Acerca de nosotros</a>
            <a href="#">Contactanos</a>
            <a href="#">Rastrea tu paquete</a>
            <button class="btnLogin-popup">Login</button>
        </nav>
    </header>

    <div class="wrapper">
        <span class="icon-close">
            <ion-icon name="close"></ion-icon>
        </span>

        <div class="form-box login">
            <h2>Inicia Sesion</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>
                    <input type="mail" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>
                    <input type="password" required>
                    <label>Contraseña</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox">Recuerdame</label>
                    <a href="#">Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <div class="login-register">
                    <p>Aun no tienes cuenta? <a href="#" class="register-link">Registrate</a></p>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <h2>Registrate</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>
                    <input type="mail" required>
                    <label>Agrega tu e-mail</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>
                    <input type="password" required>
                    <label>Crea tu contraseña</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="call"></ion-icon>
                    </span>
                    <input type="tel" required>
                    <label>Valida tu telefono</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox">Yo acepto los siguientes</label>
                    <a href="#">terminos y condiciones</a>
                </div>
                <button type="submit" class="btn">Registrate</button>
                <div class="login-register">
                    <p>Ya tienes una cuenta con nosotros? <a href="#" class="login-link">Inicia sesion</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="javascript/script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <div class="loader"></div>
</body>
</html>
