<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/Logo - icon.png">
    <title>πTech | Optimizar </title>
    <link rel="stylesheet" href="/styles/ruta.css">
</head>
<body>
    <br><br><br><br><br><br><br><br>
    <div class="container">
        <div>
            <button type="button" onclick="verRutas()">Ver detalles del lote</button><br><br>
        </div>
        <div>
            <input type="text" id="buscarLote" placeholder="Ingresa el id del lote a buscar"><br>
            <button class="search-button" type="button" onclick="buscarRutas()">Buscar lote</button>
        </div>
    </div>
    <div class="background"></div>
    <div class="overlay"></div>
    <div class="lotes"></div>
    <br><br><br>
    <div class="container">
        <button type="button" onclick="window.location.href='driver_seleccion.html'">Regresar</button>
    </div>
    
    <script>
        // Simulamos el inicio de sesión asignando valores a sessionStorage
        // En una aplicación real, estos datos se establecerían después de un inicio de sesión exitoso
        if (!sessionStorage.getItem('nombreUser')) {
            window.location.href = 'notFound.html';
        } else {
            const idUsuario = sessionStorage.getItem('idUser');
            const nombreUsuario = sessionStorage.getItem('nombreUser');
            const apellidoUsuario = sessionStorage.getItem('apellidosUser');
            console.log(`Nombre: ${nombreUsuario}`);
            console.log(`Apellido: ${apellidoUsuario}`);
            
            // Actualizamos el contenido del elemento de bienvenida
            document.getElementById("bienvenida").innerHTML = `Bienvenido ${nombreUsuario}`;
        }
        </script>
    <script type="module">
        import { obtenerRuta } from './Funciones/optmizadorRuta.js'
        import { obtenerLotes } from './Funciones/detallesLotes.js'
        import { buscarLote } from './Funciones/detallesLotes.js'

        async function optimizar() {
            obtenerRuta();
        }

        window.optimizar = optimizar;

        function verRutas() {
            obtenerLotes();
        }

        window.verRutas = verRutas;
        
        function buscarRutas(){
            const idLote = parseInt(document.getElementById("buscarLote").value);
            buscarLote(idLote);
        }

        window.buscarRutas = buscarRutas;
    </script>
    
</body>
</html>
