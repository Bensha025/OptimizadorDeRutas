<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Administrador</title>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/gh/alphardex/aqua.css@master/dist/aqua.min.css'>
    <link rel="stylesheet" href="/styles/transicion.css">
    <link rel="stylesheet" href="css/style2.css">
    <link rel="stylesheet" href="cssq/load.css">
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
</head>
<body>
    <form class="form">
        <div class="login-form" action="javascript:void(0);">
            <h1>Registrarse</h1>
            <div class="form-input-material">
                <input type="text" name="usuario" id="usuario" placeholder=" " autocomplete="off" class="form-control-material" required"> <br>
                <label for="nombre">Nombre</label>
            </div>
            <div class="form-input-material">
                <input type="text" name="apellido" id="apellido" placeholder=" " autocomplete="off" class="form-control-material" required"> <br>
                <label for="apellido">Apellido</label>
            </div>
            <div class="form-input-material">
            <input type="text" name="correo" id="correo" placeholder=" " autocomplete="off" class="form-control-material" required"> <br>
            <label for="correo">Correo</label>
            </div>
            <div class="form-input-material">
                <input type="file" name="archivo" id="archivo" placeholder=" " autocomplete="off" class="form-control-material" required"> <br>
                <label for="file"></label>
            </div>
            <div class="form-input-material">
                <input type="password" name="pass" id="pass" placeholder=" " autocomplete="off" class="form-control-material" required"> <br>
                <label for="pass">Contraseña</label>
            </div>
            <button type="submit" value="Enviar" id="enviar" class="btn btn-primary btn-ghost">Enviar</button>
        </div>
    </form>
</body>
    <script src="lib/jquery-3.3.1.min.js"></script>
    <script type="module" src="Funciones/firebaseConect.js"></script>
    <script type="module">
        // Importamos funciones externas.
        import { adminUser } from './Funciones/altasUsuarios.js';
        import { validarCorreoAdmin } from './Funciones/altasUsuarios.js';
        import { db, storage} from './Funciones/firebaseConect.js';
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

        // Valida el correo.
        async function validaCorreo(){
            const correo = document.getElementById("correo").value;
            if (correo.includes("@")) {
                const resultado = await validarCorreoAdmin(correo);
                if(resultado == 1){
                    swal("Correo registrado");
                    document.getElementById("correo").value = "";
                }
            }else{
                document.getElementById("correo").value = "";
                swal("Ingresa un correo valido.")
            }
        }

        window.validaCorreo = validaCorreo;

        // Almacena la imagen.
        async function uploadFile(file){
            const storageRef = ref(storage, 'archivosAdministrador/' + file.name);
            
            await uploadBytes(storageRef, file);
            const url = await getDownloadURL(storageRef); // Obtén la URL de descarga
            
            return url;
        }

        // Valida el formulario para enviarlo a la base de datos.
        async function validar(){
            
            const nombre = document.getElementById("usuario").value;
            const apellido = document.getElementById("apellido").value;
            const correo = document.getElementById("correo").value;  
            const pass = document.getElementById("pass").value;
            const archivo = document.getElementById("archivo").files[0];

            if (nombre !== "" && apellido !== "" && correo !== "" && pass !== "" && archivo){
                try{
                    // Subir el archivo y obtener la URL
                    const archivoUrl = await uploadFile(archivo);
                    
                    const adminData ={
                        nombre: nombre,
                        apellido: apellido,
                        correo: correo,
                        pass: pass,
                        archivo: archivoUrl,
                        rol: 0,
                        status: true,
                        eliminado: false
                    };

                    adminUser(adminData);
                } catch (error){
                    console.error("Error al subir el archivo:", error);
                    swal("Error al subir el archivo. Inténtalo de nuevo.");
                }
            } else{
                swal("Por favor, completa todos los campos.");
            }
        }

        document.getElementById("enviar").addEventListener("click", function(event){
        event.preventDefault();
            validar(); 
        });
    </script>

</html>
